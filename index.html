<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vertex Work Manager</title>
<meta name="theme-color" content="#E9ECF2">
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5 22 21H2z' fill='none' stroke='%23141414' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M17.3 11.6 22 21h-9.4z' fill='%23E01F26'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ================= TOKENS ================= */
:root{
  --accent:#E01F26;
  --accent-soft:color-mix(in srgb, var(--accent) 13%, transparent);
  --bg1:#EEF0F5; --bg2:#DDE2EC; --blob1:#E4E3F2; --blob2:#EAE3E6;
  --glass:rgba(255,255,255,.52); --glass-b:rgba(255,255,255,.85);
  --card:#FFFFFF; --card2:#F4F5F8; --field:#FFFFFF;
  --ink:#141414; --ink2:#50535B; --muted:#8B8E97; --line:rgba(20,22,30,.08);
  --pill-on:#141414; --pill-on-ink:#FFFFFF;
  --good:#1F8A4C; --good-soft:rgba(31,138,76,.12); --warn:#B26B00; --warn-soft:rgba(178,107,0,.12);
  --chart2:#A3A8B5;
  --shadow:0 12px 34px rgba(40,50,80,.08); --shadow-s:0 4px 14px rgba(40,50,80,.07);
  --r-xl:30px; --r-l:22px; --r-m:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"]{
  --bg1:#14151A; --bg2:#1B1D24; --blob1:#1F2130; --blob2:#261E24;
  --glass:rgba(38,40,48,.55); --glass-b:rgba(255,255,255,.07);
  --card:#23252D; --card2:#2A2D36; --field:#2A2D36;
  --ink:#F3F3F5; --ink2:#BFC1C8; --muted:#8A8D96; --line:rgba(255,255,255,.08);
  --pill-on:#F3F3F5; --pill-on-ink:#141414; --chart2:#5E626E;
  --shadow:0 12px 34px rgba(0,0,0,.35); --shadow-s:0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(900px 520px at 85% -8%, var(--blob1), transparent 70%),
  radial-gradient(800px 480px at -5% 105%, var(--blob2), transparent 70%),
  linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;background-attachment:fixed;transition:background .4s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ================= SHELL ================= */
.shell{display:grid;grid-template-columns:72px 1fr;gap:18px;padding:18px;min-height:100vh}
.rail{position:sticky;top:18px;height:calc(100vh - 36px);background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--glass-b);border-radius:40px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0;box-shadow:var(--shadow-s)}
.rail .sep{width:24px;height:1px;background:var(--line);margin:6px 0}
.rail .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;align-items:center}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:transform .25s var(--ease),box-shadow .25s,color .2s,background .2s;position:relative}
.circ:hover{transform:translateY(-2px);box-shadow:var(--shadow-s);color:var(--ink)}
.circ.dark{background:var(--pill-on);color:var(--pill-on-ink);border-color:transparent}
.circ.sm{width:34px;height:34px}
.circ.sm svg.i{width:15px;height:15px}
.circ[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--pill-on);color:var(--pill-on-ink);font-size:11px;font-weight:600;padding:6px 10px;border-radius:10px;white-space:nowrap;z-index:5;pointer-events:none}
.main{min-width:0;display:flex;flex-direction:column;gap:22px;padding-bottom:40px}

/* topbar */
.topbar{display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap;cursor:pointer}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.nav{display:flex;gap:4px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--glass-b);padding:5px;border-radius:40px;margin:0 auto;box-shadow:var(--shadow-s)}
.nav a{padding:9px 18px;border-radius:30px;font-weight:500;font-size:13px;color:var(--ink2);cursor:pointer;transition:background .3s var(--ease),color .3s;white-space:nowrap;position:relative}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--pill-on);color:var(--pill-on-ink)}
.top-actions{display:flex;gap:10px;align-items:center}
.me{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--card);box-shadow:var(--shadow-s);cursor:pointer}

/* title row */
.title-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.title-row h1{font-size:30px;font-weight:600;margin:0;letter-spacing:-.02em}
.title-row .sub{color:var(--muted);font-size:13px;margin-top:6px}
.title-row .grow{flex:1}
.tabs{display:inline-flex;gap:4px;background:var(--glass);border:1px solid var(--glass-b);padding:4px;border-radius:30px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:24px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .3s var(--ease)}
.tabs button.on{background:var(--pill-on);color:var(--pill-on-ink)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card);padding:11px 20px;border-radius:30px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s,background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-s)}
.btn.dark{background:var(--pill-on);color:var(--pill-on-ink);border-color:transparent}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
.btn.sm{padding:8px 14px;font-size:12px}
.btn:disabled{opacity:.6;pointer-events:none}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:12px}

/* glass panels + cards */
.glass{background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-b);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:var(--r-l);padding:22px;border:1px solid var(--line);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
.card-h h3{font-size:15px;font-weight:600;margin:0}
.card-h .note{font-size:12px;color:var(--muted);margin-top:4px}
.card-h .acts{display:flex;gap:6px}
.g{display:grid;gap:16px}
.g-hero{grid-template-columns:1.55fr 1fr}
.g-3{grid-template-columns:1fr 1fr 1.15fr}
.g-2{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.big{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:10px 0 2px}
.big small{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.delta{font-size:12px;color:var(--muted)}
.delta b{font-weight:600}.delta .up{color:var(--good)}.delta .down{color:var(--accent)}
.chart-box{position:relative;height:230px;margin-top:14px}
.legend{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.empty{color:var(--muted);font-size:13px;padding:26px 0;text-align:center}

/* avatar */
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:13px;overflow:hidden;position:relative;border:2px solid var(--card);color:#2A2C33}
.av img{width:100%;height:100%;object-fit:cover}
.av.s{width:34px;height:34px;font-size:11px}
.av.l{width:64px;height:64px;font-size:20px}
.av.xl{width:96px;height:96px;font-size:28px}
.badge{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);min-width:18px;height:18px;border-radius:10px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}
.av-wrap{position:relative;display:inline-block}
.strip{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .25s var(--ease)}
.strip .item:hover{transform:translateY(-3px)}
.strip .item .av{width:48px;height:48px}
.strip .add{width:48px;height:48px;border-radius:50%;border:1.5px dashed var(--muted);display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none;background:transparent}

/* rings */
.rings{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ring-card{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:var(--card2)}
.ring .fg{stroke:var(--accent);animation:ring 1.1s var(--ease) both}
.ring .fg.grey{stroke:var(--ink)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:600}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.ring-card .t{font-size:12px;color:var(--muted)}
.ring-card .v{font-size:17px;font-weight:600;margin-top:4px}

/* pill rows */
.rows{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:40px;padding:7px 14px 7px 7px;transition:transform .25s var(--ease),background .2s,box-shadow .25s;cursor:pointer;min-width:0}
.row:hover{transform:translateX(3px);background:var(--card);box-shadow:var(--shadow-s)}
.row .n{flex:1;min-width:0}
.row .n div{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n small{display:block;color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;white-space:nowrap;font-size:13px}
.row .amt.red{color:var(--accent)}

/* bar list */
.blist{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.brow .t{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:7px}
.brow .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .t b{font-weight:600;white-space:nowrap}
.brow .t small{color:var(--muted);margin-left:6px;font-weight:500}
.track{height:8px;background:var(--card2);border-radius:8px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:8px;transform-origin:left;animation:grow 1s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;border:0;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
button.pill{cursor:pointer}
.p-paid,.p-done{background:var(--good-soft);color:var(--good)}
.p-unpaid{background:var(--accent-soft);color:var(--accent)}
.p-prog{background:var(--warn-soft);color:var(--warn)}
.p-pend{background:var(--card2);color:var(--ink2)}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{border:1px solid var(--line);background:var(--field);border-radius:30px;padding:11px 18px;min-width:0;outline:none;transition:box-shadow .2s,border-color .2s}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 4px var(--accent-soft)}
.search{flex:1;min-width:200px}

/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:10px;min-height:200px;border-radius:24px;padding:4px;transition:background .2s}
.col.over{background:var(--accent-soft)}
.col-h{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:11px;font-weight:600;font-size:13px}
.col-h span{background:var(--card2);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--ink2)}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:40px;padding:8px 10px 8px 8px;cursor:grab;transition:transform .25s var(--ease),box-shadow .25s,opacity .2s;position:relative}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-s)}
.tile.drag{opacity:.4}
.tile .n{flex:1;min-width:0}
.tile .n div{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .n small{display:block;font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .dot{width:8px;height:8px;border-radius:50%;flex:none}

/* table */
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 14px;white-space:nowrap}
.tbl td{background:var(--card);padding:10px 14px;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tbl td:first-child{border-radius:30px 0 0 30px;border-left:1px solid var(--line)}
.tbl td:last-child{border-radius:0 30px 30px 0;border-right:1px solid var(--line)}
.tbl .num{text-align:right}
.tbl tr{transition:transform .2s var(--ease)}
.tbl tbody tr:hover{transform:translateX(3px)}
.tbl-wrap{overflow-x:auto;margin:-8px 0}
.tfoot{display:flex;gap:18px;justify-content:flex-end;flex-wrap:wrap;font-size:13px;margin-top:12px;color:var(--ink2)}
.tfoot b{color:var(--ink)}

/* clients */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s}
.ccard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.ccard .hd{display:flex;align-items:center;gap:12px}
.ccard .hd .n{flex:1;min-width:0}
.ccard .hd b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .hd small{color:var(--muted);font-size:11px}
.ccard .mid{display:flex;justify-content:space-between;margin:18px 0 10px}
.ccard .mid .v{font-size:20px;font-weight:600}
.ccard .mid .l{font-size:11px;color:var(--muted);margin-top:2px}
.mini-rings{display:flex;gap:14px}
.mini-rings .ring{width:66px;height:66px}
.mini-rings .ring b{font-size:12px}
.mini-rings .cap{font-size:10px;color:var(--muted);text-align:center;margin-top:4px}

/* services */
.srow{display:grid;grid-template-columns:minmax(140px,1.2fr) 2fr auto auto auto;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:40px;padding:10px 10px 10px 22px;transition:transform .25s var(--ease),box-shadow .25s}
.srow:hover{transform:translateX(3px);box-shadow:var(--shadow-s)}
.srow b{font-weight:600}
.srow .det{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .used{font-size:11px;color:var(--muted);white-space:nowrap}
.price{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:7px 14px;border-radius:20px;white-space:nowrap}
.acts{display:flex;gap:6px}

/* plans */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:24px;display:flex;flex-direction:column;transition:transform .3s var(--ease),box-shadow .3s}
.plan:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.plan.hot{background:var(--pill-on);color:var(--pill-on-ink)}
.plan.hot .muted,.plan.hot li span{color:color-mix(in srgb, var(--pill-on-ink) 65%, transparent)}
.plan.hot li{border-color:color-mix(in srgb, var(--pill-on-ink) 14%, transparent)}
.plan .nm{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.plan .pr{font-size:34px;font-weight:700;margin:12px 0 4px;letter-spacing:-.02em}
.plan .pr small{font-size:13px;font-weight:500;opacity:.6}
.plan ul{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:11px;font-size:13px}
.plan li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:9px}
.plan li span{color:var(--ink2)}
.plan li b{font-weight:600;text-align:right}
.plan .adv{margin-top:auto;padding-top:18px;font-size:12px}
.plan input{width:100%;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--field);font-size:12px;color:var(--ink)}
.plan.hot input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:inherit}
.plan li.edit{display:grid;grid-template-columns:1fr;gap:6px}

/* settings */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.logo-edit{display:flex;align-items:center;gap:18px;margin:14px 0 18px}
.logo-box{width:84px;height:84px;border-radius:24px;background:var(--card2);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.logo-box img{width:100%;height:100%;object-fit:contain}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:transform .2s var(--ease)}
.sw:hover{transform:scale(1.1)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw-custom{position:relative;overflow:hidden;display:grid;place-items:center;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw-custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.toggle-row:last-child{border-bottom:0}
.switch{width:44px;height:26px;border-radius:20px;background:var(--card2);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-s);transition:transform .3s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}

/* ================= MODAL ================= */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(210,215,228,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .3s var(--ease) both}
:root[data-theme="dark"] .ov{background:rgba(0,0,0,.4)}
.ov.out{animation:fade .2s reverse both}
.dialog{background:var(--glass);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--glass-b);border-radius:34px;width:min(470px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(30,40,70,.18);animation:pop .45s var(--ease) both}
.ov.out .dialog{animation:pop .2s reverse both}
.dialog.wide{width:min(560px,100%)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96);filter:blur(6px)}}
.dg-h{display:flex;justify-content:space-between;align-items:center;padding:24px 26px 18px;border-bottom:1px solid var(--line)}
.dg-h h2{font-size:18px;font-weight:600;margin:0}
.dg-b{padding:20px 26px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.dg-f{padding:18px 26px 24px;display:flex;gap:10px}
.dg-f .btn{flex:1;padding:14px}
.fld label{display:block;font-size:12px;color:var(--ink2);margin:0 0 8px 4px}
.fld .field{width:100%}
.fld textarea.field{border-radius:22px;resize:vertical;min-height:84px}
.fld .hint{font-size:11px;color:var(--muted);margin:6px 0 0 6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--card2);border-radius:30px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:24px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .3s var(--ease)}
.seg button.on{background:var(--pill-on);color:var(--pill-on-ink)}
.stepper{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:30px;padding:4px}
.stepper button{border:0;background:var(--card2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px}
.stepper input{border:0;background:transparent;width:100%;text-align:center;font-weight:600;font-size:15px;outline:none}
.sel-client{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:40px;padding:5px 5px 5px 5px}
.sel-client input{border:0;background:transparent;flex:1;outline:none;padding:8px 6px;min-width:0}
.sum{display:flex;align-items:center;justify-content:space-between;background:var(--field);border:1px solid var(--line);border-radius:30px;padding:10px 12px 10px 20px}
.sum span{font-size:12px;color:var(--muted)}
.sum b{font-size:22px;font-weight:600}
.slider{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;margin-top:10px}
.slider div{height:100%;background:var(--accent);border-radius:8px;transition:width .4s var(--ease)}
.photo-edit{display:flex;flex-direction:column;align-items:center;gap:10px}
.photo-edit .av{cursor:pointer}
.photo-edit .cam{position:absolute;right:0;bottom:0;width:30px;height:30px;border-radius:50%;background:var(--pill-on);color:var(--pill-on-ink);display:grid;place-items:center;border:2px solid var(--card)}
.photo-edit .cam svg.i{width:14px;height:14px}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-stats div{background:var(--field);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center}
.mini-stats span{display:block;font-size:11px;color:var(--muted)}
.mini-stats b{font-size:15px;font-weight:600}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lbox{width:min(400px,100%);text-align:center;padding:36px 30px}
.lbox .logo-box{margin:0 auto 18px;width:76px;height:76px;border-radius:24px;background:var(--card)}
.lbox h1{font-size:22px;margin:0 0 6px;font-weight:600}
.lbox p{color:var(--muted);margin:0 0 24px;font-size:13px}
.lbox .fld{text-align:left;margin-bottom:12px}
.pin{letter-spacing:.4em;text-align:center;font-size:20px;font-weight:600}
.err{color:var(--accent);font-size:12px;min-height:18px;margin:6px 0 10px}

/* misc */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--pill-on);color:var(--pill-on-ink);padding:13px 22px;border-radius:30px;font-size:13px;font-weight:500;z-index:99;max-width:90vw;box-shadow:var(--shadow);animation:pop .4s var(--ease) both}
.toast.bad{background:var(--accent);color:#fff}
.loader{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);transform-origin:left;animation:load 1.1s ease-in-out infinite;z-index:100}
@keyframes load{0%{transform:scaleX(0)}60%{transform:scaleX(.8)}100%{transform:scaleX(1);opacity:0}}
.banner{background:var(--warn-soft);color:var(--warn);padding:11px 18px;border-radius:30px;font-size:12px;font-weight:500}
.muted{color:var(--muted)}
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(8px)}}
.menu{position:fixed;z-index:70;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:var(--shadow);min-width:180px;animation:pop .25s var(--ease) both}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:14px;cursor:pointer;font-size:13px;text-align:left}
.menu button:hover{background:var(--card2)}
.menu button.del{color:var(--accent)}
.fab,.mnav{display:none}

/* ================= RESPONSIVE ================= */
@media (max-width:1180px){
  .g-3{grid-template-columns:1fr 1fr}
  .g-3>:last-child{grid-column:1/-1}
  .nav a{padding:9px 13px}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;padding:14px 12px 110px;gap:14px}
  .rail,.nav{display:none}
  .topbar .brand span{font-size:14px}
  .top-actions{margin-left:auto}
  .top-actions .hide-m{display:none}
  .g-hero,.g-3,.g-2,.pgrid,.set-grid{grid-template-columns:1fr}
  .g-3>:last-child{grid-column:auto}
  .glass{padding:12px;border-radius:26px}
  .card{padding:18px}
  .title-row h1{font-size:24px}
  .big{font-size:28px}
  .rings{grid-template-columns:1fr 1fr}
  .ring-card{flex-direction:column;align-items:flex-start;gap:10px}
  .board{grid-template-columns:repeat(3,85%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .col{scroll-snap-align:start}
  .srow{grid-template-columns:1fr auto;padding:12px 10px 12px 18px}
  .srow .det,.srow .used{grid-column:1/2}
  .srow .price{grid-row:1;grid-column:2}
  .srow .acts{grid-column:2;justify-content:flex-end}
  .mnav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;background:color-mix(in srgb, var(--card) 88%, transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-b);border-radius:40px;padding:6px;box-shadow:var(--shadow);justify-content:space-between}
  .mnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:30px;font-size:10px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .3s var(--ease)}
  .mnav a.on{background:var(--pill-on);color:var(--pill-on-ink)}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;z-index:51;cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb, var(--accent) 40%, transparent)}
  .fab svg.i{width:24px;height:24px;stroke-width:2.4}
  .ov{place-items:end center;padding:0}
  .dialog{width:100%;border-radius:30px 30px 0 0;max-height:92vh;animation-name:sheet}
  .ov.out .dialog{animation-name:sheet}
  @keyframes sheet{from{transform:translateY(100%)}}
  .dg-f{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login" class="login hidden">
  <div class="glass lbox rise">
    <div class="logo-box" id="lLogo"></div>
    <h1 id="lBrand">Vertex Media</h1>
    <p>Work manager. Enter your PIN to continue.</p>
    <div class="fld" id="urlFld"><label>Apps Script URL</label><input class="field" id="lUrl" placeholder="https://script.google.com/macros/s/.../exec"><div class="hint">Sirf pehli baar chahiye</div></div>
    <div class="fld"><label>PIN</label><input class="field pin" id="lPin" type="text" inputmode="numeric" autocomplete="one-time-code" name="vx-pin" maxlength="12" spellcheck="false" style="-webkit-text-security:disc"></div>
    <label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);margin-top:6px"><input type="checkbox" id="lRem"> Remember me on this device</label>
    <div class="err" id="lErr"></div>
    <button class="btn dark" style="width:100%;padding:14px" id="lBtn">Unlock</button>
    <div style="margin-top:18px;font-size:12px;color:var(--muted)">Sirf design dekhna hai? <button class="link" id="demoBtn">Open demo</button></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="shell hidden">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <header class="topbar">
      <div class="brand" data-act="go" data-arg="dashboard"><div class="logo" id="brandLogo"></div><span id="brandName">Vertex Media</span></div>
      <nav class="nav" id="nav"></nav>
      <div class="top-actions">
        <button class="circ hide-m" data-act="refresh" title="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
        <button class="circ" data-act="theme" title="Light / Dark" id="themeTop"></button>
        <div class="me" data-act="go" data-arg="settings" id="meAv" title="Settings"></div>
      </div>
    </header>
    <div id="demoBanner" class="banner hidden">Demo mode: sample data hai, sheet mein kuch save nahi hoga. <button class="link" data-act="logout">Exit demo</button></div>
    <div id="view"></div>
  </main>
</div>
<nav class="mnav hidden" id="mnav"></nav>
<button class="fab hidden" id="fab" data-act="addEntry" aria-label="Add entry"><svg class="i"><use href="#i-plus"/></svg></button>
<div id="modalRoot"></div>
<input type="file" id="filePick" accept="image/*" class="hidden">

<!-- ================= ICONS ================= -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-dash" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></symbol>
  <symbol id="i-work" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="2"/><rect x="10" y="4" width="5" height="10" rx="2"/><rect x="17" y="4" width="4" height="13" rx="2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/></symbol>
  <symbol id="i-user-plus" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.8-3.5 3.4-5.5 6.5-5.5 1.6 0 3 .5 4.2 1.4M18 14v6M15 17h6"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></symbol>

  <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 9h16M4 15h16M10 3v18"/></symbol>

<script>
/* ================= CONFIG ================= */
// Optional: apna Apps Script URL yahan daal do, phir login pe URL nahi maangega.
const DEFAULT_API_URL = '';

/* ================= STATE ================= */
const EMPTY = { entries:[], services:[], plans:[], clients:[], settings:{}, sheetUrl:'' };
const S = { data:JSON.parse(JSON.stringify(EMPTY)), view:'dashboard', demo:false, charts:[], period:'month', workView:'board',
  filters:{ q:'', month:'', pay:'' }, planEdit:false, clientQ:'' };
const CFG = { url:'', pin:'' };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ic = (n, cls) => `<svg class="i ${cls||''}"><use href="#i-${n}"/></svg>`;

/* ================= STORAGE ================= */
const ls = (()=>{ try{ return localStorage; }catch(e){ return null; } })();
const ss = (()=>{ try{ return sessionStorage; }catch(e){ return null; } })();
const get = (k)=>{ try{ return (ls&&ls.getItem(k)) || (ss&&ss.getItem(k)) || ''; }catch(e){ return ''; } };
function loadCfg(){ CFG.url = DEFAULT_API_URL || get('vx_url'); CFG.pin = get('vx_pin'); }
function saveCfg(remember){ try{ ls&&ls.setItem('vx_url',CFG.url); if(remember&&ls) ls.setItem('vx_pin',CFG.pin); else { ls&&ls.removeItem('vx_pin'); ss&&ss.setItem('vx_pin',CFG.pin); } }catch(e){} }
function cacheBrand(){ try{ ls&&ls.setItem('vx_brand', JSON.stringify({brandName:set('brandName'),logo:set('logo'),accent:set('accent')})); }catch(e){} }

/* ================= UTIL ================= */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(Number(n)||0).toLocaleString('en-IN');
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => ymd(new Date());
const mKey = s => String(s||'').slice(0,7);
const pDate = s => { const p=String(s).split('-'); return new Date(+p[0], (+p[1]||1)-1, +p[2]||1); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel = k => { const [y,m]=k.split('-'); return MON[+m-1]+' '+y; };
const dLabel = s => { if(!s) return ''; const d=pDate(s); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); };
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function monthKeys(n){ const d=new Date(); const out=[]; for(let i=n-1;i>=0;i--) out.push(ymd(new Date(d.getFullYear(), d.getMonth()-i, 1)).slice(0,7)); return out; }
function waLink(phone, text){ let p=String(phone||'').replace(/\D/g,''); if(p.length===10) p='91'+p; return 'https://wa.me/'+p+'?text='+encodeURIComponent(text); }
const set = k => { const v=S.data.settings||{}; const D={brandName:'Vertex Media',ownerName:'Shivam',accent:'#E01F26',monthlyTarget:50000,logo:''}; return (v[k]===undefined||v[k]==='')?D[k]:v[k]; };
function widgets(){ let w={}; try{ w=JSON.parse(set('widgets')||'{}')||{}; }catch(e){} return Object.assign({hero:true,clients:true,rings:true,dues:true,services:true,daily:true,recent:true}, w); }
function toast(msg, bad){ $$('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'+(bad?' bad':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
let busy=0; function loading(on){ busy+=on?1:-1; let l=$('#loader'); if(busy>0&&!l){ l=document.createElement('div'); l.id='loader'; l.className='loader'; document.body.appendChild(l);} if(busy<=0){ busy=0; l&&l.remove(); } }
const PALETTE=['#DCE3F2','#F2E1DC','#E0EDDD','#ECE3F4','#F4ECD6','#D9ECEE','#F1DDE6','#E6E6E0'];
function hue(n){ let h=0; for(const c of String(n)) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }
function clientProfile(name){ return (S.data.clients||[]).find(c=>c.name.toLowerCase()===String(name).toLowerCase()); }
function avatar(name, cls, badge){
  const p=clientProfile(name);
  const inner = p&&p.photo ? `<img src="${esc(p.photo)}" alt="">` : esc(initials(name));
  const a=`<div class="av ${cls||''}" style="background:${p&&p.photo?'var(--card2)':hue(name)}">${inner}</div>`;
  return badge ? `<div class="av-wrap">${a}<span class="badge">${badge}</span></div>` : a;
}
function logoHtml(){ const l=set('logo'); return l ? `<img src="${esc(l)}" alt="logo">` : `<svg viewBox="0 0 24 24" width="80%" height="80%"><path d="M12 2.5 22 21H2z" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/><path d="M17.3 11.6 22 21h-9.4z" fill="var(--accent)"/></svg>`; }
function ringSvg(p, grey){ const r=36, c=+(2*Math.PI*r).toFixed(1), v=Math.max(0,Math.min(1,p||0)); return `<svg viewBox="0 0 86 86"><circle class="bg" cx="43" cy="43" r="${r}"/><circle class="fg ${grey?'grey':''}" cx="43" cy="43" r="${r}" style="--c:${c};stroke-dasharray:${c};stroke-dashoffset:${(c*(1-v)).toFixed(1)}"/></svg>`; }

/* ================= THEME & BRAND ================= */
function applyTheme(){ const t=get('vx_theme')||'light'; document.documentElement.dataset.theme=t; const b=$('#themeTop'); if(b) b.innerHTML=ic(t==='dark'?'sun':'moon'); }
function applyBrand(){
  document.documentElement.style.setProperty('--accent', set('accent'));
  const name=set('brandName');
  $('#brandName').textContent=name; $('#lBrand').textContent=name; document.title=name+' · Work Manager';
  $('#brandLogo').innerHTML=logoHtml(); $('#lLogo').innerHTML=logoHtml();
  $('#meAv').innerHTML=`<div class="av" style="width:100%;height:100%;border:0;background:${hue(set('ownerName'))}">${esc(initials(set('ownerName')))}</div>`;
  const l=set('logo'); $('#favicon').href = l || $('#favicon').href;
}

/* ================= API ================= */
async function api(action, data){
  if(S.demo) return demoApi(action, data||{});
  loading(true);
  try{
    const res=await fetch(CFG.url,{method:'POST',body:JSON.stringify({pin:CFG.pin,action,data:data||{}})});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'Error');
    S.data=Object.assign(JSON.parse(JSON.stringify(EMPTY)), j.data);
    cacheBrand();
    return S.data;
  } finally { loading(false); }
}
async function run(action, data, okMsg){
  try{ await api(action,data); if(okMsg) toast(okMsg); applyBrand(); render(true); return true; }
  catch(e){ toast(e.message||'Kuch galat hua', true); return false; }
}

/* ================= DEMO ================= */
function demoApi(action, d){
  const D=S.data;
  const price=n=>{ const s=D.services.find(x=>x.name===n); return s&&s.rate!=null?s.rate:0; };
  const calc=e=>{ e.rate=e._saved!=null?e._saved:price(e.work); e.amount=(e.qty===''||e.qty==null?1:+e.qty)*e.rate+(+e.changes||0); return e; };
  const up=o=>JSON.parse(JSON.stringify(o));
  switch(action){
    case 'addEntry': D.entries.push(calc({...d,id:'D'+Date.now(),_saved:price(d.work)})); break;
    case 'updateEntry': { const i=D.entries.findIndex(e=>e.id===d.id), o=D.entries[i]; D.entries[i]=calc({...o,...d,_saved:o.work===d.work?o._saved:price(d.work)}); break; }
    case 'deleteEntry': D.entries=D.entries.filter(e=>e.id!==d.id); break;
    case 'addService': if(D.services.some(s=>s.name.toLowerCase()===d.name.trim().toLowerCase())) throw new Error('Ye service pehle se hai'); D.services.push({name:d.name.trim(),rate:+d.price,details:(+d.price)+'/- '+(d.details||'')}); break;
    case 'updateService': { const s=D.services.find(x=>x.name===d.oldName); D.entries.forEach(e=>{ if(e.work===d.oldName){ if(e._saved==null) e._saved=s.rate; e.work=d.name; } }); Object.assign(s,{name:d.name,rate:+d.price,details:d.details}); break; }
    case 'deleteService': { const s=D.services.find(x=>x.name===d.name); D.entries.forEach(e=>{ if(e.work===d.name&&e._saved==null) e._saved=s.rate; }); D.services=D.services.filter(x=>x.name!==d.name); break; }
    case 'saveClient': { const old=d.oldName||d.name; let c=clientProfile(old); if(!c){ c={name:d.name,phone:'',photo:'',notes:''}; D.clients.push(c); } if(old!==d.name) D.entries.forEach(e=>{ if(e.client===old) e.client=d.name; }); Object.assign(c,{name:d.name},d.phone!==undefined?{phone:d.phone}:{},d.photo!=null?{photo:d.photo}:{},d.notes!==undefined?{notes:d.notes}:{}); delete c.oldName; break; }
    case 'deleteClient': D.clients=D.clients.filter(c=>c.name!==d.name); break;
    case 'saveSettings': Object.keys(d).forEach(k=>{ D.settings[k]=typeof d[k]==='object'?JSON.stringify(d[k]):d[k]; }); break;
    case 'savePlans': d.rows.slice(0,11).forEach((r,i)=>{ D.plans[i]=r; }); break;
  }
  D.entries.forEach(calc);
  return Promise.resolve(up(D));
}

function periodRange(p){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  if(p==='last') return {from:ymd(new Date(y,m-1,1)),to:ymd(new Date(y,m,0)),pf:ymd(new Date(y,m-2,1)),pt:ymd(new Date(y,m-1,0)),label:'Last month',vs:'month before',mult:1};
  if(p==='year') return {from:ymd(new Date(y,0,1)),to:ymd(new Date(y,11,31)),pf:ymd(new Date(y-1,0,1)),pt:ymd(new Date(y-1,11,31)),label:'This year',vs:'last year',mult:12};
  return {from:ymd(new Date(y,m,1)),to:ymd(new Date(y,m+1,0)),pf:ymd(new Date(y,m-1,1)),pt:ymd(new Date(y,m,0)),label:'This month',vs:'last month',mult:1};
}
function metrics(){
  const E=S.data.entries, R=periodRange(S.period), keys=monthKeys(12);
  const by={}; keys.forEach(k=>by[k]={total:0,paid:0});
  const M={keys,by,R,paid:0,total:0,pPaid:0,delivered:0,count:0,paidAll:0,unpaidAll:0,pending:0,svc:{},cli:{}};
  E.forEach(e=>{
    const a=+e.amount||0, k=mKey(e.date), inP=e.date>=R.from&&e.date<=R.to, inPrev=e.date>=R.pf&&e.date<=R.pt, paid=e.payment==='Paid';
    if(by[k]){ by[k].total+=a; if(paid) by[k].paid+=a; }
    if(inP){ M.total+=a; if(paid) M.paid+=a; M.count++; if(e.status==='Delivered') M.delivered++; M.svc[e.work]=(M.svc[e.work]||0)+a; }
    if(inPrev&&paid) M.pPaid+=a;
    if(paid) M.paidAll+=a; else M.unpaidAll+=a;
    if(e.status!=='Delivered') M.pending++;
  });
  M.clients=clientList();
  return M;
}
function clientList(){
  const map={};
  (S.data.clients||[]).forEach(c=>{ map[c.name.toLowerCase()]={name:c.name,phone:c.phone,photo:c.photo,notes:c.notes,total:0,paid:0,due:0,jobs:0,done:0,last:''}; });
  S.data.entries.forEach(e=>{
    const k=e.client.toLowerCase(); if(!map[k]) map[k]={name:e.client,phone:'',photo:'',notes:'',total:0,paid:0,due:0,jobs:0,done:0,last:''};
    const c=map[k], a=+e.amount||0; c.total+=a; c.jobs++; if(e.payment==='Paid') c.paid+=a; else c.due+=a; if(e.status==='Delivered') c.done++;
    if(e.phone&&!c.phone) c.phone=e.phone; if(e.date>c.last) c.last=e.date;
  });
  return Object.values(map);
}
function deltaHtml(now,before,vs){
  if(!before) return `<span class="delta">${now?'Pehli kamai is period mein':'Abhi tak koi kamai nahi'}</span>`;
  const p=(now-before)/before*100, up=p>=0;
  return `<span class="delta"><b class="${up?'up':'down'}">${up?'↑':'↓'} ${Math.abs(p).toFixed(1)}%</b> vs ${vs}</span>`;
}

  const tot=rows.reduce((s,e)=>s+(+e.amount||0),0), paid=rows.filter(e=>e.payment==='Paid').reduce((s,e)=>s+(+e.amount||0),0);
  const foot=`<div class="tfoot"><span>${rows.length} entries</span><span>Total <b>${inr(tot)}</b></span><span>Paid <b>${inr(paid)}</b></span><span>Pending <b style="color:var(--accent)">${inr(tot-paid)}</b></span></div>`;
  if(S.workView==='table') return rows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Client</th><th>Work</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Changes</th><th class="num">Amount</th><th>Status</th><th>Payment</th><th></th></tr></thead><tbody>
    ${rows.map(e=>`<tr><td>${dLabel(e.date)}</td><td><div style="display:flex;align-items:center;gap:10px">${avatar(e.client,'s')}<b style="font-weight:600">${esc(e.client)}</b></div></td><td>${esc(e.work)}</td><td class="num">${e.qty===''?1:e.qty}</td><td class="num">${inr(e.rate)}</td><td class="num">${e.changes?inr(e.changes):'<span class="muted">-</span>'}</td><td class="num"><b style="font-weight:600">${inr(e.amount)}</b></td><td>${pill(e,'status',1)}</td><td>${pill(e,'payment',1)}</td><td><div class="acts"><button class="circ sm" data-act="editEntry" data-arg="${e.id}" title="Edit">${ic('edit')}</button><button class="circ sm" data-act="delEntry" data-arg="${e.id}" title="Delete">${ic('trash')}</button></div></td></tr>`).join('')}
    </tbody></table></div>${foot}`:'<div class="empty">Koi entry nahi mili</div>';
  const cols=['Pending','In progress','Delivered'];
  return `<div class="board">${cols.map(c=>{ const list=rows.filter(e=>(e.status||'Pending')===c); return `<div class="col" data-col="${c}"><div class="col-h">${c}<span>${list.length}</span></div>
    ${list.map(e=>`<div class="tile" draggable="true" data-id="${e.id}" data-act="editEntry" data-arg="${e.id}">${avatar(e.client,'s')}<div class="n"><div>${esc(e.client)}</div><small>${esc(e.work)}${e.qty>1?' × '+e.qty:''} · ${inr(e.amount)}</small></div>
      <span class="dot" title="${esc(e.payment)}" style="background:${e.payment==='Paid'?'var(--good)':'var(--accent)'}"></span><button class="circ sm" data-act="entryMenu" data-arg="${e.id}" title="More">${ic('more')}</button></div>`).join('')||'<div class="empty" style="padding:18px 0">Drop here</div>'}
  </div>`; }).join('')}</div>${foot}`;
}
function bindBoard(){
  const q=$('#wq'), m=$('#wm');
  if(q) q.oninput=()=>{ S.filters.q=q.value; $('#workBody').innerHTML=workBody(); bindDrag(); };
  if(m) m.onchange=()=>{ S.filters.month=m.value; $('#workBody').innerHTML=workBody(); bindDrag(); };
  bindDrag();
}
function bindDrag(){
  $$('.tile').forEach(t=>{ t.ondragstart=ev=>{ ev.dataTransfer.setData('text/plain',t.dataset.id); t.classList.add('drag'); }; t.ondragend=()=>t.classList.remove('drag'); });
  $$('.col').forEach(c=>{
    c.ondragover=ev=>{ ev.preventDefault(); c.classList.add('over'); };
    c.ondragleave=()=>c.classList.remove('over');
    c.ondrop=async ev=>{ ev.preventDefault(); c.classList.remove('over'); const id=ev.dataTransfer.getData('text/plain'); const e=S.data.entries.find(x=>x.id===id); if(e&&e.status!==c.dataset.col) await run('updateEntry',{...e,status:c.dataset.col},'Moved to '+c.dataset.col); };
  });
}

/* ================= MODALS ================= */
function modal(html, wide){ $('#modalRoot').innerHTML=`<div class="ov" data-ov="1"><div class="dialog ${wide?'wide':''}" role="dialog">${html}</div></div>`; document.body.style.overflow='hidden'; }
function closeModal(){ const o=$('.ov'); if(!o) return; o.classList.add('out'); setTimeout(()=>{ $('#modalRoot').innerHTML=''; document.body.style.overflow=''; },190); }
const dgHead=t=>`<div class="dg-h"><h2>${t}</h2><button class="circ sm" data-act="close">${ic('x')}</button></div>`;
function confirmBox(title,text,yes){
  return new Promise(res=>{ modal(dgHead(esc(title))+`<div class="dg-b"><p class="muted" style="margin:0;font-size:13px;line-height:1.6">${esc(text)}</p></div><div class="dg-f"><button class="btn" id="cNo">Cancel</button><button class="btn accent" id="cYes">${yes||'Delete'}</button></div>`);
    $('#cNo').onclick=()=>{closeModal();res(false)}; $('#cYes').onclick=()=>{closeModal();res(true)}; });
}

/* entry */
function openEntry(id, preset){
  const e=id?S.data.entries.find(x=>x.id===id):{date:today(),client:'',phone:'',work:'',qty:1,changes:'',status:'Pending',payment:'Unpaid',notes:'',...(preset||{})};

    <div class="f2"><div class="fld"><label>Date</label><input class="field" type="date" id="fDate" value="${esc(e.date)}"></div><div class="fld"><label>Phone</label><input class="field" id="fPhone" inputmode="tel" value="${esc(e.phone)}" placeholder="10 digit"></div></div>

    <div class="f2"><div class="fld"><label>Qty</label><div class="stepper"><button type="button" data-step="-1">−</button><input id="fQty" inputmode="numeric" value="${e.qty===''?1:esc(e.qty)}"><button type="button" data-step="1">+</button></div></div>
      <div class="fld"><label>Changes (₹)</label><input class="field" id="fCh" inputmode="numeric" value="${esc(e.changes)}" placeholder="0"><div class="hint">Amount mein plus hoga</div></div></div>
    <div class="fld"><label>Status</label><div class="seg" id="fSt">${['Pending','In progress','Delivered'].map(s=>`<button type="button" class="${e.status===s?'on':''}" data-v="${s}">${s}</button>`).join('')}</div></div>
    <div class="fld"><label>Payment</label><div class="seg" id="fPy">${['Unpaid','Paid'].map(s=>`<button type="button" class="${e.payment===s?'on':''}" data-v="${s}">${s}</button>`).join('')}</div></div>
    <div class="fld"><label>Notes</label><textarea class="field" id="fNotes" placeholder="Optional">${esc(e.notes)}</textarea></div>
    <div><div class="sum"><span id="fCalc"></span><b id="fTot"></b></div><div class="slider"><div id="fBar"></div></div></div>
  </div><div class="dg-f">${id?`<button class="btn" data-act="delEntry" data-arg="${e.id}">${ic('trash')}</button>`:''}<button class="btn" data-act="close">Cancel</button><button class="btn dark" id="fSave">${id?'Save changes':'Add work'}</button></div>`);
  const recalc=()=>{ const w=$('#fWork').value, s=svcs.find(x=>x.name===w); let r=s&&s.rate!=null?s.rate:0; if(id&&w===e.work) r=e.rate;
    const q=+$('#fQty').value||1, ch=+$('#fCh').value||0, tot=r*q+ch; $('#fCalc').textContent=`${inr(r)} × ${q}${ch?' + '+inr(ch):''}`; $('#fTot').textContent=inr(tot);
    const mx=Math.max(...S.data.entries.map(x=>+x.amount||0), tot, 1); $('#fBar').style.width=Math.min(100,tot/mx*100)+'%'; };
  ['#fWork','#fQty','#fCh'].forEach(s=>$(s).addEventListener('input',recalc));
  $('#fClient').addEventListener('input',()=>{ const v=$('#fClient').value; $('#fAv').innerHTML=avatar(v||'?','s'); const p=clientList().find(c=>c.name.toLowerCase()===v.toLowerCase()); if(p&&p.phone&&!$('#fPhone').value) $('#fPhone').value=p.phone; });
  $$('.dialog [data-step]').forEach(b=>b.onclick=()=>{ const i=$('#fQty'); i.value=Math.max(1,(+i.value||1)+(+b.dataset.step)); recalc(); });
  $$('.dialog .seg').forEach(g=>g.onclick=ev=>{ const b=ev.target.closest('button'); if(!b) return; g.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
  recalc();
  $('#fSave').onclick=async()=>{
    const d={id:e.id,date:$('#fDate').value||today(),client:$('#fClient').value.trim(),phone:$('#fPhone').value.trim(),work:$('#fWork').value,qty:$('#fQty').value,changes:$('#fCh').value,status:$('#fSt .on').dataset.v,payment:$('#fPy .on').dataset.v,notes:$('#fNotes').value.trim()};

    if(await run(id?'updateEntry':'addEntry',d,id?'Work updated':'Work added')) closeModal(); else { b.disabled=false; b.textContent='Try again'; }
  };
}

function entryMenu(id, btn){
  $$('.menu').forEach(m=>m.remove());
  const e=S.data.entries.find(x=>x.id===id), r=btn.getBoundingClientRect(), m=document.createElement('div'); m.className='menu';
  m.innerHTML=`<button data-act="editEntry" data-arg="${id}">${ic('edit')}Edit</button><button data-act="togglePaid" data-arg="${id}">${ic('tag')}Mark ${e.payment==='Paid'?'unpaid':'paid'}</button>${e.phone?`<button data-act="waEntry" data-arg="${id}">${ic('wa')}WhatsApp</button>`:''}<button class="del" data-act="delEntry" data-arg="${id}">${ic('trash')}Delete</button>`;
  document.body.appendChild(m);
  m.style.top=Math.min(window.innerHeight-m.offsetHeight-10, r.bottom+6)+'px'; m.style.left=Math.max(10, Math.min(window.innerWidth-m.offsetWidth-10, r.right-m.offsetWidth))+'px';
}

/* ================= IMAGES ================= */
function compressImage(file, maxSide, maxChars, square, alpha){
  return new Promise((res,rej)=>{
    const fr=new FileReader(), img=new Image();
    fr.onload=()=>img.src=fr.result; fr.onerror=()=>rej(new Error('File read nahi hui'));
    img.onerror=()=>rej(new Error('Image open nahi hui'));
    img.onload=()=>{
      let side=maxSide, q=.86, out='';
      for(let t=0;t<9;t++){
        let sx=0,sy=0,sw=img.width,sh=img.height;
        if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
        const sc=Math.min(1,side/Math.max(sw,sh)), c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(sw*sc)); c.height=Math.max(1,Math.round(sh*sc));
        const x=c.getContext('2d'); if(!alpha){ x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); } x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
        out=alpha?c.toDataURL('image/webp',q):c.toDataURL('image/jpeg',q);
        if(alpha&&!out.startsWith('data:image/webp')) out=c.toDataURL('image/png');
        if(out.length<=maxChars) return res(out);
        side=Math.round(side*.8); q=Math.max(.5,q-.08);
      }
      rej(new Error('Image bahut badi hai, choti image try karo'));
    };
    fr.readAsDataURL(file);
  });
}
let pickMode='';
function pick(mode){ pickMode=mode; const f=$('#filePick'); f.value=''; f.click(); }
$('#filePick').onchange=async ev=>{
  const file=ev.target.files[0]; if(!file) return;
  try{
    if(pickMode==='logo'){ const url=await compressImage(file,320,45000,false,true); await run('saveSettings',{logo:url},'Logo updated'); }
    else { photoDraft=await compressImage(file,220,40000,true,false); const n=$('#cName').value||'?'; $('#cPh').innerHTML=`<div class="av xl"><img src="${photoDraft}" alt=""></div>`; toast('Photo ready. "Save client" dabao.'); }
  }catch(e){ toast(e.message,true); }
};

/* ================= ACTIONS (event delegation) ================= */
const A={
  go:a=>go(a), close:()=>closeModal(), refresh:async()=>{ if(await run('getAll')) toast('Updated'); },
  theme:()=>{ const t=document.documentElement.dataset.theme==='dark'?'light':'dark'; try{ ls&&ls.setItem('vx_theme',t); }catch(e){} applyTheme(); render(true); },
  setTheme:t=>{ try{ ls&&ls.setItem('vx_theme',t); }catch(e){} applyTheme(); render(true); },
  sheet:()=>S.data.sheetUrl?window.open(S.data.sheetUrl,'_blank'):toast('Demo mein sheet link nahi hai'),
  period:p=>{ S.period=p; render(true); }, workView:v=>{ S.workView=v; render(true); }, payFilter:p=>{ S.filters.pay=p; render(true); },
  addEntry:()=>openEntry(), editEntry:id=>openEntry(id), addEntryFor:n=>{ const c=clientList().find(x=>x.name===n)||{}; closeModal(); setTimeout(()=>openEntry(null,{client:n,phone:c.phone||''}),200); },
  delEntry:async id=>{ const e=S.data.entries.find(x=>x.id===id); closeModal(); await new Promise(r=>setTimeout(r,200)); if(await confirmBox('Delete work?',`${e.client} · ${e.work} · ${inr(e.amount)}. Sheet se bhi hat jayega.`)) run('deleteEntry',{id},'Deleted'); },
  togglePaid:id=>{ const e=S.data.entries.find(x=>x.id===id); run('updateEntry',{...e,payment:e.payment==='Paid'?'Unpaid':'Paid'},'Payment updated'); },
  cycleStatus:id=>{ const e=S.data.entries.find(x=>x.id===id), o=['Pending','In progress','Delivered']; run('updateEntry',{...e,status:o[(o.indexOf(e.status)+1)%3]},'Status updated'); },
  waEntry:id=>{ const e=S.data.entries.find(x=>x.id===id); window.open(waLink(e.phone,remind(e.client,e.amount)),'_blank'); },
  entryMenu:(id,el)=>entryMenu(id,el),
  addClient:()=>openClient(), openClient:n=>openClient(n),
  delClient:async n=>{ closeModal(); await new Promise(r=>setTimeout(r,200)); if(await confirmBox('Delete client profile?',`${n} ki photo, phone aur notes hat jayenge. Kaam ki entries Master mein rahengi.`)) run('deleteClient',{name:n},'Profile deleted'); },
  pickPhoto:()=>pick('photo'), removePhoto:()=>{ photoDraft=''; $('#cPh').innerHTML=`<div class="av xl" style="background:${hue($('#cName').value)}">${esc(initials($('#cName').value||'?'))}</div>`; },
  addService:()=>openService(), editService:n=>openService(n),
  delService:async n=>{ if(await confirmBox('Delete service?',`"${n}" Price List se hat jayega. Purani entries ka amount same rahega.${/Plan$/.test(n)?' Ye Plans ka price hai, delete karne se Plans mein price khaali ho jayega.':''}`)) run('deleteService',{name:n},'Service deleted'); },
  planEdit:v=>{ S.planEdit=v==='1'; render(true); }, savePlans:()=>savePlans(),
  saveSettings:()=>saveSettings(), pickLogo:()=>pick('logo'), resetLogo:()=>run('saveSettings',{logo:''},'Default logo'),
  accent:c=>{ $('#stAccent').value=c; document.documentElement.style.setProperty('--accent',c); $$('#sw .sw').forEach(s=>s.classList.toggle('on',s.dataset.arg===c)); },
  widget:k=>{ pendingWidgets=pendingWidgets||widgets(); pendingWidgets[k]=!pendingWidgets[k]; $(`[data-act="widget"][data-arg="${k}"]`).classList.toggle('on',pendingWidgets[k]); },
  saveUrl:()=>{ CFG.url=$('#stUrl').value.trim(); saveCfg(!!(ls&&ls.getItem('vx_pin'))); toast('URL saved'); },
  logout:()=>logout()
};
document.addEventListener('click',ev=>{
  if(!ev.target.closest('.menu')) $$('.menu').forEach(m=>m.remove());
  if(ev.target.closest('[data-stop]')) return;
  if(ev.target.dataset.ov) return closeModal();
  const el=ev.target.closest('[data-act]'); if(!el) return;
  ev.preventDefault(); ev.stopPropagation();
  const f=A[el.dataset.act]; if(f) f(el.dataset.arg, el);
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='cq'){ S.clientQ=ev.target.value; const q=S.clientQ.toLowerCase(); const list=clientList().filter(c=>!q||c.name.toLowerCase().includes(q)); $('#cgrid').innerHTML=list.map((c,j)=>clientCard(c,j)).join('')||'<div class="empty">Koi client nahi mila</div>'; }
  if(ev.target.id==='stAccent'){ document.documentElement.style.setProperty('--accent',ev.target.value); $$('#sw .sw').forEach(s=>s.classList.remove('on')); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); $$('.menu').forEach(m=>m.remove()); } });

/* ================= BOOT ================= */
function showApp(){ $('#login').classList.add('hidden'); ['#app','#mnav','#fab'].forEach(s=>$(s).classList.remove('hidden')); $('#demoBanner').classList.toggle('hidden',!S.demo); applyBrand(); render(); }
function showLogin(msg){ ['#app','#mnav','#fab'].forEach(s=>$(s).classList.add('hidden')); $('#login').classList.remove('hidden'); $('#urlFld').classList.toggle('hidden',!!CFG.url); $('#lUrl').value=CFG.url; $('#lErr').textContent=msg||''; setTimeout(()=>$('#lPin').focus(),60); }
async function login(){
  const url=(CFG.url||$('#lUrl').value).trim(), pin=$('#lPin').value.trim();
  if(!url) return $('#lErr').textContent='Apps Script URL paste karo'; if(!pin) return $('#lErr').textContent='PIN daalo';
  CFG.url=url; CFG.pin=pin; S.demo=false; const b=$('#lBtn'); b.disabled=true; b.textContent='Checking…';
  try{ await api('getAll'); saveCfg($('#lRem').checked); showApp(); }
  catch(e){ $('#lErr').textContent=e.message==='Wrong PIN'?'PIN galat hai':'Connect nahi hua: '+e.message; if(!DEFAULT_API_URL) $('#urlFld').classList.remove('hidden'); }
  finally{ b.disabled=false; b.textContent='Unlock'; }
}
function logout(){ try{ ls&&ls.removeItem('vx_pin'); ss&&ss.removeItem('vx_pin'); }catch(e){} CFG.pin=''; S.demo=false; S.data=JSON.parse(JSON.stringify(EMPTY)); closeModal(); showLogin(); $('#lPin').value=''; }
$('#lBtn').onclick=login; $('#lPin').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
$('#demoBtn').onclick=()=>{ S.demo=true; S.data=demoData(); showApp(); };
(async function boot(){
  applyTheme(); loadCfg();
  try{ const b=JSON.parse((ls&&ls.getItem('vx_brand'))||'{}'); S.data.settings=Object.assign({},b); }catch(e){}
  applyBrand();
  if(new URLSearchParams(location.search).has('demo')){ S.demo=true; S.data=demoData(); return showApp(); }
  if(CFG.url&&CFG.pin){ try{ await api('getAll'); return showApp(); }catch(e){ return showLogin(e.message==='Wrong PIN'?'PIN galat hai':''); } }
  showLogin();
})();
</script>
